<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Glasses</title>
<style>
  :root { --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #dddbd4; --accent: #2f6f5e; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #20201e; --ink: #ecebe6; --muted: #9c9a93; --line: #34332f; --accent: #6fbfa6; --bad: #f2867f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .muted { color: var(--muted); font-size: .9rem; }
  progress { width: 100%; height: 8px; margin-top: 12px; }
  #log { max-height: 160px; overflow: auto; font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); margin-top: 8px; white-space: pre-wrap; }
  #answer { margin-top: 12px; font-size: 1.05rem; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Smart Glasses</h1>
  <p class="sub">Pictures go in, words come out. The back end keeps only the words.</p>

  <section>
    <h2>Who and where</h2>
    <div class="row">
      <div><label for="user">Your user ID</label><input id="user" type="text" value="krish" autocomplete="off"></div>
      <div><label for="server">Back end</label><input id="server" type="text" value="http://127.0.0.1:8765" autocomplete="off"></div>
    </div>
  </section>

  <section>
    <h2>1. Send pictures (one per second, like the glasses)</h2>
    <label for="folder">Pick the folder of pictures</label>
    <input id="folder" type="file" webkitdirectory multiple accept="image/*">
    <div class="actions">
      <button id="send">Send</button>
      <button id="stop" disabled>Stop</button>
      <span id="status" class="muted">No folder picked.</span>
    </div>
    <progress id="progress" value="0" max="1"></progress>
    <div id="log"></div>
  </section>

  <section>
    <h2>2. Ask</h2>
    <label for="question">Your question</label>
    <input id="question" type="text" placeholder="Where are my keys?">
    <div class="actions"><button id="ask">Ask</button></div>
    <div id="answer"></div>
  </section>
</main>
<script>
const MAX_SIDE = 320, QUALITY = 0.7, DELAY_MS = 1000;
const $ = (id) => document.getElementById(id);
let stopRequested = false;

function pictures() {
  return Array.from($("folder").files || [])
    .filter((f) => f.type.startsWith("image/"))
    .sort((a, b) => (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name));
}

$("folder").addEventListener("change", () => { $("status").textContent = `${pictures().length} pictures ready.`; });

// Low resolution before it leaves the device: faster to describe, and less of a photograph to begin with.
async function shrink(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, MAX_SIDE / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close();
  return canvas.toDataURL("image/jpeg", QUALITY).split(",")[1];
}

async function post(message) {
  const reply = await fetch($("server").value.replace(/\/$/, "") + "/message", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(message),
  });
  const body = await reply.json().catch(() => ({ error: `HTTP ${reply.status}` }));
  if (!reply.ok && !body.error) body.error = `HTTP ${reply.status}`;
  return body;
}

function log(line) { $("log").textContent += line + "\n"; $("log").scrollTop = $("log").scrollHeight; }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

$("send").addEventListener("click", async () => {
  const files = pictures();
  if (!files.length) { $("status").textContent = "Pick a folder with pictures first."; return; }
  stopRequested = false; $("send").disabled = true; $("stop").disabled = false;
  $("progress").max = files.length; $("progress").value = 0; $("log").textContent = "";
  let ok = 0;
  for (let i = 0; i < files.length && !stopRequested; i++) {
    if (i) await sleep(DELAY_MS);
    try {
      const reply = await post({ user_id: $("user").value.trim(), timestamp: new Date().toISOString(), image_base64: await shrink(files[i]) });
      if (reply.ack) ok++;
      log(`${i + 1}/${files.length} ${files[i].name}: ${reply.ack ? "ok" : reply.error}`);
    } catch (e) {
      log(`${i + 1}/${files.length} ${files[i].name}: ${e.message} (is the back end running?)`);
    }
    $("progress").value = i + 1;
    $("status").textContent = `Sent ${i + 1} of ${files.length}, ${ok} remembered.`;
  }
  $("send").disabled = false; $("stop").disabled = true;
});

$("stop").addEventListener("click", () => { stopRequested = true; });

async function ask() {
  const question = $("question").value.trim();
  if (!question) return;
  $("answer").textContent = "Thinking...";
  try {
    const reply = await post({ user_id: $("user").value.trim(), question });
    $("answer").className = reply.error ? "err" : "";
    $("answer").textContent = reply.error || reply.answer;
  } catch (e) {
    $("answer").className = "err"; $("answer").textContent = `${e.message} (is the back end running?)`;
  }
}
$("ask").addEventListener("click", ask);
$("question").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
</script>
</body>
</html>
